<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coding club</title>
</head>
<style>
    #hero{
  border:none;
  background-color: royalblue;
  border-radius:10px;
  text-align: center;
  color:white;
  padding:10px;
}
.card{
  border:none;
  background-color: white;
  border-radius: 10px;
}
body{
  background-color: lightgray;
}
table{
  padding:20px;
  width:100%;
  border-collapse: collapse;
  
}
h2{
  padding:15px 0px 0px 15px;
}
th{
  background-color: royalblue;
  text-align: left;
  color:white;
  padding:15px;
  text-decoration: none;
}
td{
  border-bottom: 1px solid lightgray;
  padding:15px;
}
p{
  text-align: left;
  padding-left:15px;
}
button{
  margin:15px;
  color:white;
  background-color:royalblue;
  padding:7px 15px;
  border-radius:8px;
  border:0;
  font-size: 1rem;
}
#first{
  text-align: center;
}
*{
  box-sizing: border-box;
}
</style>


<body>
      <div id="hero">
        <h1>Coding Club</h1>
        <p id="first">Learn. Build. Share.</p>
    </div>
    <div class="card">
        <h2>Upcoming Events</h2>
        <table>
            <tr>
                <th>Event</th>
                <th>Date</th>
                <th>Venue</th>
            </tr>
            <tr>
                <td>HTML Workshop</td>
                <td>12 Nov</td>
                <td>Lab 1</td>
            </tr>
            <tr>
                <td>Hackathon</td>
                <td>20 Nov</td>
                <td>Seminar Hall</td>
            </tr>
        </table>
    </div>
    <div class="card">
        <h2>Register</h2>
        <p>Name: <input type="text" placeholder="Your name"></p>
        <p>Email: <input type="email" placeholder="you@example.com"></p>
        <button>Register</button>
    </div>
</body>

</html>
