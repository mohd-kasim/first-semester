!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Profile Card</title>


    <style>
        *{
  box-sizing: border-box;
}
body{
  margin:0;
}
header{
  position:sticky;
  background:royalblue;
  color:white;
  text-align: center;
  padding:10px;
  margin-top:0;
}
.avatar{
  width:90px;
  height:90px;
  border-radius: 50%;
  font-size:36px;
  margin:0 auto 10px;
  line-height: 90px;
  color:white;
  background:royalblue;
  text-align: center;
  color:yellow;
}
p,h2{
  text-align: center;
}
.card{
  border:2px solid royalblue;
  border-radius: 20px;
  background: white ;
  width: 300px;
  margin:auto;
  padding: 20px;
  margin-top: 40px;
}
body{
  background: #eef;
}
.bio{
  border:1px solid black;
  padding:5px;
  border-radius:10px;
  overflow: auto;
  height:90px;
  font-size: 14px;
}
.fab{
    width:60px;
    height: 60px;
    border-radius: 50%;
    border:0;
    background: lightyellow;
    position: fixed;
    right: 15px;
    bottom: 15px;
    font-size: 28px;

}
    </style>

    
</head>

<body>
    <header>My Profile Page</header>
    <div class="card">
        <div class="avatar">K</div>
        <h2>Mohd Kasim</h2>
        <p>Web Developer in Making</p>
        <div class="bio">
            Hi! I am Kasim. I started coding this year. I like making small websites,
            drawing and listening to music. My goal is to build my own app. This long
            text is here so that the box shows a scroll bar. Try scrolling it!
        </div>
    </div>
    <button class="fab">+</button>
</body>
</html>
